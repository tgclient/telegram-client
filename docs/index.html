    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            -webkit-text-size-adjust: 100%;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;

            padding-bottom: max(16px, env(safe-area-inset-bottom));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 24px 20px;
            max-width: 500px;
            width: 100%;
            max-height: calc(100dvh - 32px);
            max-height: calc(100vh - 32px);
            box-shadow: 0 20px 60px rgba(180, 83, 9, 0.35);
            text-align: center;
            margin: auto;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        
        .container::-webkit-scrollbar {
            width: 4px;
        }
        .container::-webkit-scrollbar-track {
            background: transparent;
        }
        .container::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 2px;
        }
        
        .logo {
            width: 72px;
            height: 72px;
            margin: 16px auto 16px;
            border-radius: 50%;
            overflow: hidden;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .logo svg {
            width: 48px;
            height: 48px;
            fill: white;
        }
        
        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: clamp(22px, 5vw, 28px);
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 24px;
            font-size: clamp(13px, 3.5vw, 15px);
            line-height: 1.5;
        }
        
        .features {
            text-align: left;
            margin: 20px 0;
            padding: 16px;
            background: #fffbeb;
            border-radius: 12px;
        }
        
        .features li {
            list-style: none;
            padding: 6px 0;
            color: #555;
            font-size: clamp(13px, 3.5vw, 15px);
            line-height: 1.5;
        }
        
        .features li:before {
            content: "✓ ";
            color: #d97706;
            font-weight: bold;
            margin-right: 8px;
        }
        
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            text-decoration: none;
            padding: 14px 48px;
            border-radius: 30px;
            font-size: clamp(16px, 4vw, 18px);
            font-weight: bold;
            margin: 8px 0 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        .download-btn:active {
            transform: scale(0.96);
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
        }
        
        .ios-hint {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0 auto 12px;
            padding: 8px 14px;
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 1px solid #fcd34d;
            border-radius: 20px;
            font-size: clamp(12px, 3.2vw, 13px);
            color: #b45309;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            max-width: 90%;
        }
        
        .ios-hint:active {
            transform: scale(0.98);
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        }
        
        .ios-hint svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: #b45309;
        }
        
        .ios-hint .arrow {
            margin-left: 2px;
            font-size: 11px;
            color: #d97706;
        }
        
        /* 网站地址 + 复制按钮样式 */
        .site-link-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding: 10px 16px;
            background: #fffbeb;
            border-radius: 12px;
            border: 1px solid #fcd34d;
        }
        
        .site-url {
            color: #b45309;
            font-size: clamp(13px, 3.5vw, 15px);
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 0.3px;
            -webkit-tap-highlight-color: transparent;
        }
        
        .site-url:active {
            opacity: 0.7;
        }
        
        .copy-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 6px 12px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        
        .copy-btn:active {
            transform: scale(0.95);
        }
        
        .copy-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        
        .copy-btn.copied {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }
        
        @media (max-width: 375px) {
            body {
                padding: 12px;
            }
            .container {

            .logo {

            .logo svg {

                height: 40px;

            .features {
                padding: 12px;
                margin: 16px 0;
            }
            .ios-hint {

            }
            .site-link-box {

                gap: 6px;
            }

            }
        }
        
        @media (max-height: 500px) and (orientation: landscape) {
            .container {
                display: flex;
                flex-direction: row;

                text-align: left;

<body>
    <div class="container">

                <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
            </svg>
        </div>
        
        <div class="content-wrapper">
            <h1>Telegram Client</h1>
            <p class="subtitle">内置官方MTProto高速通道，即开即用。</p>
            
            <ul class="features">
                <li>无需魔法配置，安装即用。</li>
                <li>完整中文界面。</li>
                <li>解决收不到验证码、无法登陆等问题。</li>
            </ul>
            
            <a href="https://github.com/tgclient/telegram-client/releases/download/V12.5.1/android.apk" class="download-btn">安卓立即下载</a>
            
            <!-- iOS 用户提示 -->
            <div class="ios-hint" onclick="$crisp.push(['do', 'chat:open'])">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                    <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
                <span>iOS 请联系右下角客服安装登录</span>
                <span class="arrow">›</span>
            </div>
            
            <!-- 网站地址 + 复制按钮 -->
            <div class="site-link-box">
                <a href="https://www.Telegram.baby" class="site-url" target="_blank">www.Telegram.baby</a>
                <button class="copy-btn" onclick="copyUrl(this)">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    复制
                </button>
            </div>
        </div>
    </div>
    
    <script>
        function copyUrl(btn) {
            const url = 'www.Telegram.baby';
            const originalText = btn.innerHTML;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function() {
                    showCopied(btn);
                }).catch(function() {
                    fallbackCopy(url, btn);
                });
            } else {
                fallbackCopy(url, btn);
            }
        }
        
        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showCopied(btn);
            } catch (err) {
                btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>失败';
                setTimeout(function() {
                    btn.innerHTML = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }
            
            document.body.removeChild(textarea);
        }
        
        function showCopied(btn) {
            const originalHTML = btn.innerHTML;
            btn.classList.add('copied');
            btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>已复制';
            
            setTimeout(function() {
                btn.innerHTML = originalHTML;
                btn.classList.remove('copied');
            }, 2000);
        }
    </script>
